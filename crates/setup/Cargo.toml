[package]
name = "linnea-setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "Linnea-Setup"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
dirs = "6"
serde_json = "1"

[build-dependencies]
winresource = "0.1"
