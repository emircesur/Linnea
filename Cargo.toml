[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app", "crates/setup"]
# the installer embeds dist/payload.zip, made by pack.py; a plain `cargo build` leaves it out
default-members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
