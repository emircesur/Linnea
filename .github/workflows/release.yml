# Builds Linnea for Windows, macOS and Linux. A tag such as v0.1.0 publishes the three as a GitHub release;
# a manual run (Actions -> Release -> Run workflow) only builds them and keeps them as downloadable artifacts.
name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  windows:
    needs: ui
    runs-on: windows-latest
    env:
      # a short target folder keeps the build under Windows' 260-character path limit
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Windows installer
        shell: pwsh
        run: |
          python pack.py 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $errors = Select-String -Path windows-build.log -Pattern 'error:|error\[|missing from|Failed to GET|hash of downloaded|panicked at'
            foreach ($entry in ($errors | Select-Object -Last 12)) {
              $message = $entry.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Windows build::$message"
            }
          }
          exit $buildExit
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Linnea-Setup.exe

  macos:
    needs: ui
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - run: cargo build --release -p linnea-cli -p linnea-app
      - name: Make Linnea.app and the disk image
        run: bash packaging/macos.sh "${{ github.ref_name }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  linux:
    needs: ui
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: System libraries for the window
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p linnea-cli -p linnea-app
      - name: Make the archive
        run: bash packaging/linux.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Linnea ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
          body: |
            **Windows 10 / 11**: download `Linnea-Setup.exe` and run it. It needs no administrator rights.
            Windows may show "Windows protected your PC" because the installer is not signed yet:
            click **More info → Run anyway**.

            **macOS**: `Linnea-*-macos-arm64.dmg` for Apple silicon (M1 and newer), `-x64` for Intel Macs.
            Drag Linnea to Applications. The app is not notarized yet, so the first time right-click it and
            choose **Open**.

            **Linux** (x86-64): unpack `Linnea-*-linux-x64.tar.gz` and run `./install.sh`, or start
            `bin/linnea-app` straight from the folder. It needs WebKitGTK 4.1 (`libwebkit2gtk-4.1-0`).

            On macOS and Linux, install ffmpeg, yt-dlp and whisper.cpp with your package manager (for
            example `brew install ffmpeg yt-dlp whisper-cpp`); the one-click download in Settings → Tools
            fetches the Windows builds only for now.
